name: release
# Push a tag like v0.1.0 to build, sign, notarize and publish binaries.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go test ./...

      - name: Build all platforms
        run: ./scripts/build.sh

      - name: Universal macOS binary
        run: |
          lipo -create -output dist/opengit-macos dist/opengit-darwin-arm64 dist/opengit-darwin-amd64
          rm dist/opengit-darwin-arm64 dist/opengit-darwin-amd64

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" dist/opengit-macos && codesign --verify --strict --verbose=2 dist/opengit-macos

      - name: Notarize
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent dist/opengit-macos "$RUNNER_TEMP/opengit-macos.zip"
          xcrun notarytool submit "$RUNNER_TEMP/opengit-macos.zip" --key "$RUNNER_TEMP/key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          rm "$RUNNER_TEMP/key.p8"
          # distribute the signed + notarized binary zipped (preserves the executable bit)
          cp "$RUNNER_TEMP/opengit-macos.zip" dist/opengit-macos.zip
          rm dist/opengit-macos

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "OpenGit ${{ github.ref_name }}" --generate-notes
